modLoader="javafml"
loaderVersion="[2,)"
license="MIT"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    description='''
        A modern Sky Grid world generation mod.
        Generates a grid of random blocks floating in the void.
        Fully configurable via config/skygrid.json.
    '''

[[dependencies.skygrid]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.skygrid]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},)"
    ordering="NONE"
    side="BOTH"
